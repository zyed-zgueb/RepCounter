<body style="background:#0D1217;margin:0;padding:24px;font-family:Inter,sans-serif;color:#8aa"><div id="r"></div>
<script>
// Jeu proposé, épaisseurs en paramètres : W membres, H rayon de tête, B barres, G sol et montants
function make(W, H, B, G) {
  const L = `fill="none" stroke-width="${W}" stroke-linecap="round" stroke-linejoin="round"`;
  const F = `<path d="M1.5 18.3 H18.5" stroke-width="${G}" stroke-linecap="round" opacity=".55"/>`;
  const bar = d => `<path d="${d}" stroke-width="${B}" stroke-linecap="round"/>`;
  const head = (x, y) => `<circle cx="${x}" cy="${y}" r="${H}" stroke="none"/>`;
  return {
    Pompes: `${head(3.4, 8.4)}<path d="M5.8 10.2 L18.4 16.6 M6.2 10.4 L6.6 16.6" ${L}/>${F}`,
    Abdos: `${head(3.6, 9.4)}<path d="M5.6 11.2 L9.4 16.4 L13.8 11 L17.6 16.4 M6.6 11.6 L9.8 9.8" ${L}/>${F}`,
    Squats: `${head(10.4, 3.2)}<path d="M10 5.4 L7.4 10.8 L12.6 11.8 L11.6 16.6 M9.4 6.8 L15.6 7.8" ${L}/>${F}`,
    Fentes: `${head(9.6, 2.9)}<path d="M9.6 5.2 V10.6 L13.8 12.8 V16.6 M9.6 10.6 L6.6 15.6 L2.8 15.8" ${L}/>${F}`,
    Tractions: `${bar("M2.5 2.4 H17.5")}${head(10, 5.6)}<path d="M5.6 2.6 L7.8 8.8 H12.2 L14.4 2.6 M10 8.8 V13.6 M10 13.6 L8.6 17.4 M10 13.6 L11.4 17.4" ${L}/>`,
    Dips: `<path d="M3.4 10 V18.3 M16.6 10 V18.3" stroke-width="${G * 1.2}" stroke-linecap="round" opacity=".55"/>${F}${bar("M2.5 10 H6.2 M13.8 10 H17.5")}${head(10, 3.4)}<path d="M5.2 10 L8 6.2 H12 L14.8 10 M10 6.2 V12.2 M10 12.2 L8.9 15.8 M10 12.2 L11.1 15.8" ${L}/>`,
    Biceps: `${head(8.4, 3.2)}<path d="M8.4 5.4 V11.8 M8.4 11.8 L7.2 16.6 M8.4 11.8 L9.8 16.6 M8.6 6.4 L9.6 10.6 L13.6 7.2" ${L}/><rect x="11.5" y="6.25" width="4.2" height="1.9" rx=".6" stroke="none" transform="rotate(50 13.6 7.2)"/>${F}`,
    Rowing: `${head(3.8, 7)}<path d="M6 8.2 L14.4 9.6 L13.4 13.4 L14.4 16.6 M14.4 9.6 L16.8 16.6" ${L}/><path d="M8.4 8.6 L11.4 6 L11.2 11.4" ${L}/><rect x="9.1" y="11.4" width="4.2" height="1.9" rx=".6" stroke="none"/>${F}`,
    Développé: `${head(10, 6.6)}${bar("M2.5 2.4 H17.5")}<rect x="2.6" y="0.6" width="2" height="3.6" rx=".6" stroke="none"/><rect x="15.4" y="0.6" width="2" height="3.6" rx=".6" stroke="none"/><path d="M6.2 2.6 L7.6 9.4 H12.4 L13.8 2.6 M10 9.4 V12.8 M10 12.8 L8 16.6 M10 12.8 L12 16.6" ${L}/>${F}`,
    Autre: `<path d="M15.2 5.8 A6.6 6.6 0 1 0 16.4 11.6" ${L}/><path d="M15.6 2.4 L15.4 6.2 L11.8 5.8" ${L}/>${head(10, 10.2)}`,
  };
}
const row = (set, title) => `<div style="font:600 12px Inter;letter-spacing:1px;margin:10px 0 8px">${title}</div><div style="display:flex;gap:14px">` +
  Object.entries(set).map(([k, v]) => `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:66px">
   <svg width="56" height="56" viewBox="0 0 20 20" fill="#3DC2FF" stroke="#3DC2FF" style="background:#141c23;border-radius:8px">${v}</svg>
   <svg width="22" height="22" viewBox="0 0 20 20" fill="#3DC2FF" stroke="#3DC2FF">${v}</svg><span style="font-size:10px">${k}</span></div>`).join("") + `</div>`;
document.getElementById("r").innerHTML = row(make(2, 1.9, 1.6, 1), "TRAIT 2 · PROPOSITION PRÉCÉDENTE")
  + row(make(1.5, 1.65, 1.3, 0.9), "TRAIT 1,5") + row(make(1.2, 1.5, 1.1, 0.8), "TRAIT 1,2");
</script></body>
