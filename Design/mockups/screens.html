<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquettes Reps</title>
<style>
  /* Reproduction HTML de l'écran unique (WorkoutView, ExercisePicker, SettingsView) pour valider le
     rendu sans Mac. Le cadran est le héros ; l'exercice se choisit en touchant son centre ; pendant
     l'effort il ne reste que le nombre. Couleurs : RepCounter/Themes.json. Polices : JetBrains Mono
     (≈ SF Mono) et Inter (≈ SF Pro) ; pictogrammes approchant les SF Symbols. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #222; }
  .phone { width: 390px; height: 844px; overflow: hidden; position: relative;
           display: flex; flex-direction: column; padding: 54px 20px 34px; }
  .label { font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; white-space: nowrap; }
  .row { display: flex; align-items: center; gap: 8px; }
  .led { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
  .btn { height: 58px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700;
         letter-spacing: 2px; text-transform: uppercase; flex: 1; border: 1px solid transparent; }
  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .caption { position: absolute; top: 14px; left: 0; right: 0; text-align: center; font: 600 11px Inter; letter-spacing: 1px;
             color: rgba(255,255,255,.35); text-transform: uppercase; z-index: 5; }
  .light .caption { color: rgba(0,0,0,.35); }
  .top { height: 44px; display: flex; align-items: center; justify-content: space-between; }
  .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 0; }
  .bottom { display: flex; flex-direction: column; gap: 12px; }
  .bottom > .btn { flex: none; }
</style>
</head>
<body>
<div id="screen"></div>
<script>
const EXERCISES = [
  ["pushup", "Pompes", "Téléphone au sol, écran vers le haut, au niveau de ta tête.", "CAM 3D"],
  ["crunch", "Abdos", "Téléphone tenu à plat contre la poitrine.", "GYRO"],
  ["squat", "Squats", "Téléphone tenu à la main ou contre la poitrine.", "ACCÉL"],
  ["lunge", "Fentes", "Téléphone tenu à la main ou contre la poitrine.", "ACCÉL"],
  ["pullup", "Tractions", "Téléphone dans une poche de pantalon ajustée.", "ACCÉL"],
  ["dips", "Dips", "Téléphone dans une poche de pantalon ajustée.", "ACCÉL"],
  ["dumbbell", "Biceps", "Téléphone posé face à toi, à 2 m environ\u00A0: bras, buste et hanches dans l'image.", "CAMÉRA"],
  ["row", "Rowing", "Téléphone posé sur le côté, à 2 m environ\u00A0: toi de profil, bras, buste et hanches dans l'image.", "CAMÉRA"],
  ["press", "Développé", "Téléphone posé face à toi, à 2 m environ\u00A0: bras, buste et hanches dans l'image.", "CAMÉRA"],
  ["sparkles", "Autre", "Téléphone posé face à toi ou porté sur toi.", "MULTI"],
];

// Pictogrammes (repère 20 × 20). Pompes et développé : mêmes tracés que ExerciseIcon.swift.
// Abdos, squats : approximations des SF Symbols utilisés par l'app.
const L = 'fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
// Pictogrammes : le squelette commun de Design/icon/pictogrammes.html (mêmes tracés que ExerciseIcon.swift)
const S = { torso: 5.2, neck: 2.3, head: 1.5, upperArm: 2.9, forearm: 2.7, thigh: 3.7, shin: 3.7 };
const W = 1.2;                         // trait des membres
const rad = d => d * Math.PI / 180;
// Point au bout d'un segment de longueur `len`, orienté `deg` (0 = vers la droite, 90 = vers le bas)
const go = (p, len, deg) => [p[0] + len * Math.cos(rad(deg)), p[1] + len * Math.sin(rad(deg))];
const line = pts => `<polyline points="${pts.map(p => p.map(v => v.toFixed(2)).join(",")).join(" ")}" fill="none" stroke-width="${W}" stroke-linecap="round" stroke-linejoin="round"/>`;
const head = c => `<circle cx="${c[0].toFixed(2)}" cy="${c[1].toFixed(2)}" r="${S.head}" stroke="none"/>`;
const faint = (d, w = 0.8) => `<path d="${d}" stroke-width="${w}" stroke-linecap="round" fill="none" opacity=".55"/>`;
const bar = d => `<path d="${d}" stroke-width="1.1" stroke-linecap="round" fill="none"/>`;
const floor = faint("M1.5 18.3 H18.5");
// Haltère : poignée et deux disques, centré en c, orienté `deg`
const plate = c => `<rect x="${(c[0] - 0.9).toFixed(2)}" y="${(c[1] - 1.3).toFixed(2)}" width="1.8" height="2.6" rx=".5" stroke="none"/>`;
const dumbbell = (c, deg) => `<g transform="translate(${c[0].toFixed(2)} ${c[1].toFixed(2)}) rotate(${deg})">
  <path d="M-1.5 0 H1.5" stroke-width="0.9" stroke-linecap="round"/><rect x="-2.1" y="-1" width="1.1" height="2" rx=".35" stroke="none"/><rect x="1" y="-1" width="1.1" height="2" rx=".35" stroke="none"/></g>`;

// Corps de profil : de la hanche, tronc incliné de `torsoDeg` ; renvoie épaule et tête
function trunk(hip, torsoDeg) {
  const shoulder = go(hip, S.torso, torsoDeg);
  return { shoulder, headC: go(shoulder, S.neck, torsoDeg) };
}
const leg = (hip, thighDeg, shinDeg) => { const knee = go(hip, S.thigh, thighDeg); return [hip, knee, go(knee, S.shin, shinDeg)]; };
const arm = (shoulder, upperDeg, foreDeg) => { const elbow = go(shoulder, S.upperArm, upperDeg); return [shoulder, elbow, go(elbow, S.forearm, foreDeg)]; };

const P = {};
// Pompes : planche, bras tendus, pieds et mains au sol
{ const slope = 26; const foot = [17.6, 18]; const hip = go(foot, S.thigh + S.shin, 180 + slope);
  const { shoulder, headC } = trunk(hip, 180 + slope);
  P.Pompes = line([foot, hip, shoulder]) + line([shoulder, go(shoulder, S.upperArm + S.forearm, 90)]) + head(headC) + floor; }
// Abdos : allongé, genoux pliés, buste relevé, bras vers les genoux
{ const hip = [8.6, 17.4]; const legPts = leg(hip, -50, 60);
  const { shoulder, headC } = trunk(hip, 180 + 35);
  P.Abdos = line(legPts) + line([hip, shoulder]) + line(arm(shoulder, -12, -12)) + head(headC) + floor; }
// Squats : en bas du mouvement, bras tendus devant
{ const foot = [8.6, 18]; const knee = go(foot, S.shin, -65); const hip = go(knee, S.thigh, 188);
  const { shoulder, headC } = trunk(hip, -58);
  P.Squats = line([foot, knee, hip, shoulder]) + line(arm(shoulder, 2, 2)) + head(headC) + floor; }
// Fentes : buste droit, cuisse avant horizontale, genou arrière près du sol, bras le long du corps
{ const hip = [9.4, 14.3]; const front = leg(hip, -2, 90); const back = leg(hip, 116, 180);
  const { shoulder, headC } = trunk(hip, -90);
  P.Fentes = line(front) + line(back) + line([hip, shoulder]) + line(arm(shoulder, 62, 18)) + head(headC) + floor; }
// Tractions : de face, suspendu, coudes pliés
{ const handL = [5.8, 2.6], handR = [14.2, 2.6]; const sL = [7.8, 6.4], sR = [12.2, 6.4]; const neck = [10, 6.4];
  const eL = [5.1, 5.0], eR = [14.9, 5.0]; const hip = [10, 6.4 + S.torso];
  P.Tractions = bar("M2.5 2.4 H17.5") + line([handL, eL, sL, sR, eR, handR]) + line([neck, hip]) + head([10, 6.4 - S.neck])
    + line([hip, go(hip, S.thigh + S.shin, 101)]) + line([hip, go(hip, S.thigh + S.shin, 79)]); }
// Dips : de face, en appui bras tendus sur deux barres, pieds au-dessus du sol
{ const y = 5.0; const sL = [7.8, y], sR = [12.2, y]; const neck = [10, y]; const hip = [10, y + S.torso];
  const hL = go(sL, S.upperArm + S.forearm, 108), hR = go(sR, S.upperArm + S.forearm, 72);
  P.Dips = faint(`M${hL[0] - 1.8} ${hL[1]} V18.3 M${hR[0] + 1.8} ${hR[1]} V18.3`, 1) + floor
    + bar(`M${hL[0] - 2.2} ${hL[1]} H${hL[0] + 0.6} M${hR[0] - 0.6} ${hR[1]} H${hR[0] + 2.2}`)
    + line([hL, sL, sR, hR]) + line([neck, hip]) + head([10, y - S.neck])
    + line([hip, go(hip, S.thigh + S.shin - 0.6, 100)]) + line([hip, go(hip, S.thigh + S.shin - 0.6, 80)]); }
// Biceps : de profil, debout, coude au corps, avant-bras levé avec l'haltère
{ const hip = [9.2, 10.8]; const { shoulder, headC } = trunk(hip, -90);
  const a = arm(shoulder, 72, -48);
  P.Biceps = line([go(hip, S.thigh + S.shin, 96), hip, go(hip, S.thigh + S.shin, 84)]) + line([hip, shoulder]) + line(a) + head(headC)
    + plate(a[2]) + floor; }
// Rowing haltère : un genou et une main sur le banc, dos plat, l'autre bras tire l'haltère (coude au-dessus du dos)
{ const benchTop = 14.4; const hip = [12.2, benchTop - S.thigh];
  const { shoulder, headC } = trunk(hip, 180 + 18);
  const support = [shoulder, go(shoulder, benchTop - shoulder[1], 90)];
  const kneel = [hip, [hip[0], benchTop], [hip[0] + 1.6, benchTop]];
  const standFoot = [16.6, 18];
  const standKnee = [15.4, 14.4];
  const pull = arm(go(shoulder, 0.6, 18), -72, 96);
  P.Rowing = faint(`M3.2 ${benchTop + 0.7} H13.6 M4.2 ${benchTop + 0.7} V18.3 M12.6 ${benchTop + 0.7} V18.3`, 1) + floor
    + line([hip, standKnee, standFoot]) + line(kneel) + line([hip, shoulder]) + line(support) + line(pull) + plate(pull[2]) + head(headC); }
// Développé : de face, une haltère dans chaque main, coudes à hauteur d'épaules
{ const sL = [7.8, 5.6], sR = [12.2, 5.6]; const neck = [10, 5.6]; const hip = [10, 5.6 + S.torso];
  const eL = go(sL, S.upperArm, 175), eR = go(sR, S.upperArm, 5); const hL = go(eL, S.forearm, -90), hR = go(eR, S.forearm, -90);
  P.Développé = line([hL, eL, sL, sR, eR, hR]) + line([neck, hip]) + head([10, 5.6 - S.neck]) + dumbbell(hL, 0) + dumbbell(hR, 0)
    + line([go(hip, S.thigh + S.shin, 101), hip, go(hip, S.thigh + S.shin, 79)]) + floor; }
// Autre : un geste qui se répète
P.Autre = `<path d="M15.2 5.8 A6.6 6.6 0 1 0 16.4 11.6" fill="none" stroke-width="${W}" stroke-linecap="round"/><path d="M15.6 2.6 L15.4 6.1 L11.9 5.8" fill="none" stroke-width="${W}" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="10.2" r="${S.head}" stroke="none"/>`;


const ICONS = {
  pushup: P['Pompes'],
  press: P['Développé'],
  crunch: P['Abdos'],
  squat: P['Squats'],
  dumbbell: P['Biceps'],
  sparkles: P['Autre'],
  lunge: P['Fentes'],
  pullup: P['Tractions'],
  dips: P['Dips'],
  row: P['Rowing'],
  gear: '<circle cx="10" cy="10" r="2.6" fill="none" stroke-width="1.8"/><path d="M10 2.5 V5 M10 15 V17.5 M2.5 10 H5 M15 10 H17.5 M4.7 4.7 L6.5 6.5 M13.5 13.5 L15.3 15.3 M4.7 15.3 L6.5 13.5 M13.5 6.5 L15.3 4.7" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="10" r="5.6" fill="none" stroke-width="1.8"/>',
  chart: '<rect x="3" y="10" width="3" height="7" rx="1" stroke="none"/><rect x="8.5" y="6" width="3" height="11" rx="1" stroke="none"/><rect x="14" y="3" width="3" height="14" rx="1" stroke="none"/>',
  back: '<path d="M12.5 4.5 L7 10 L12.5 15.5" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
  star: '<path d="M10 2.5 L12.2 7.4 L17.5 7.9 L13.5 11.4 L14.7 16.6 L10 13.9 L5.3 16.6 L6.5 11.4 L2.5 7.9 L7.8 7.4 Z" stroke="none"/>',
  minus: '<path d="M5 10 H15" stroke-width="2.4" stroke-linecap="round"/>',
  plus: '<path d="M5 10 H15 M10 5 V15" stroke-width="2.4" stroke-linecap="round"/>',
  chevron: '<path d="M5.5 8 L10 12.5 L14.5 8" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  right: '<path d="M8 4.5 L13.5 10 L8 15.5" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
  grip: '<path d="M4 7 H16 M4 10 H16 M4 13 H16" stroke-width="1.4" stroke-linecap="round"/>',
  addc: '<circle cx="10" cy="10" r="8" stroke="none"/><path d="M6 10 H14 M10 6 V14" stroke="#fff" stroke-width="2" stroke-linecap="round"/>',
  remc: '<circle cx="10" cy="10" r="8" stroke="none"/><path d="M6 10 H14" stroke="#fff" stroke-width="2" stroke-linecap="round"/>',
  xmark: '<path d="M5 5 L15 15 M15 5 L5 15" stroke-width="2" stroke-linecap="round"/>',
  check: '<path d="M5 10.5 L8.5 14 L15 6.5" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>',
  speaker: '<path d="M3 8 H6 L10 5 V15 L6 12 H3 Z" stroke="none"/><path d="M13 7 Q15 10 13 13 M15 5 Q19 10 15 15" fill="none" stroke-width="1.5" stroke-linecap="round"/>',
};
const icon = (name, color, size = 20) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 20 20" fill="${color}" stroke="${color}" style="flex:none;--gear:${color.startsWith("#") ? hexA(color, 0.4) : color}">${ICONS[name]}</svg>`;

function hexA(hex, alpha) {
  const v = parseInt(hex.slice(1), 16);
  return `rgba(${(v >> 16) & 255},${(v >> 8) & 255},${v & 255},${alpha})`;
}

function render(t, s) {
  const c = t.colors, r = t.radius, glow = t.glow;
  const F = t.font === "monospaced" ? "'JetBrains Mono', monospace" : "Inter, sans-serif";
  const ex = EXERCISES[s.exercise ?? 0];
  const label = (text, color = c.dim) => `<span class="label" style="color:${color}">${text}</span>`;
  const led = color => `<span class="led" style="background:${color};box-shadow:0 0 ${4 * glow}px ${color}"></span>`;
  const btn = (text, color, filled = true, height = 58, extra = "") =>
    `<div class="btn" style="height:${height}px;border-radius:${r}px;background:${filled ? color : hexA(color, 0.06)};color:${filled ? c.onPrimary : color};border-color:${filled ? "transparent" : hexA(color, 0.6)};${extra}">${text}</div>`;
  const iconBtn = (name, color = c.dim) =>
    `<div style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:${r}px;border:1px solid ${c.line};background:${hexA(c.panel, 0.7)}">${icon(name, color, 17)}</div>`;

  // Lueur derrière le cadran : donne de la profondeur sans décor
  const halo = s.phase === "resting" ? c.warn : s.phase === "finished" ? c.ok : c.primary;
  const backdrop = `radial-gradient(circle at 50% 44%, ${hexA(halo, 0.13 * Math.max(glow, 0.5))} 0%, ${hexA(halo, 0)} 52%), ${c.background}`;

  let html;
  switch (s.phase) {
    case "ready": html = ready(); break;
    case "countdown": html = countdown(); break;
    case "acquiring": html = acquiring(); break;
    case "counting": html = counting(); break;
    case "resting": html = resting(); break;
    case "finished": html = finished(); break;
    case "settings": html = settings(); break;
    case "exercises": html = myExercises(); break;
    case "history": html = history(); break;
    case "session": html = sessionDetail(); break;
    case "info": html = enduranceInfo(); break;
    case "welcome": html = welcome(); break;
    case "guide": html = guide(); break;
    case "positioning": html = positioning(); break;
  }
  document.getElementById("screen").innerHTML =
    `<div class="phone ${t.scheme}" style="height:${s.height || 844}px;background:${backdrop};font-family:${F};color:${c.text}">
       <div class="caption">${s.caption || ""} · thème ${t.name}</div>${html}</div>`;

  // ——— Cadran ———
  // lit : nombre de graduations allumées (0–60) ; colors : "gradient", "pale", ou une couleur
  function ring({ lit = 60, colors = "gradient", size = 330, content = "", ripple = false, sweep = 0 }) {
    const cx = size / 2, outer = size / 2 - 3;
    let ticks = "";
    for (let i = 0; i < 60; i++) {
      const a = i / 60 * 2 * Math.PI - Math.PI / 2, major = i % 5 === 0, inner = outer - (major ? 20 : 11);
      let color = c.line;
      if (i < lit) color = colors === "gradient" ? mixColor(c.secondary, c.primary, i / 59)
        : colors === "pale" ? hexA(c.primary, 0.42) : colors;
      ticks += `<line x1="${cx + Math.cos(a) * inner}" y1="${cx + Math.sin(a) * inner}" x2="${cx + Math.cos(a) * outer}" y2="${cx + Math.sin(a) * outer}"
                 stroke="${color}" stroke-width="${major ? 3.4 : 2.2}" stroke-linecap="round"/>`;
    }
    // Aiguille fine sur la graduation courante (le mouvement, en direct)
    if (sweep) {
      const a = sweep / 60 * 2 * Math.PI - Math.PI / 2;
      ticks += `<circle cx="${cx + Math.cos(a) * (outer + 0)}" cy="${cx + Math.sin(a) * (outer + 0)}" r="4.5" fill="${c.text}"/>`;
    }
    const rip = ripple ? `<circle cx="${cx}" cy="${cx}" r="${outer * 0.74}" fill="none" stroke="${c.primary}" stroke-width="2" opacity="0.4"/>` : "";
    const shadow = glow && colors !== "pale" ? `filter:drop-shadow(0 0 ${10 * Math.min(glow, 1)}px ${hexA(colors === "gradient" ? c.primary : colors.startsWith("#") ? colors : c.primary, .45)})` : "";
    return `<div style="position:relative;width:${size}px;height:${size}px;flex:none">
      <svg width="${size}" height="${size}" style="position:absolute;inset:0;${shadow}">${ticks}${rip}</svg>
      <div class="center" style="position:absolute;inset:0">${content}</div></div>`;
  }

  function mixColor(a, b, k) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const ch = sh => Math.round(((pa >> sh) & 255) * (1 - k) + ((pb >> sh) & 255) * k);
    return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
  }

  function trace(kind, height = 46) {
    const amp = kind === "ok" ? 0.4 : kind === "weak" ? 0.12 : 0.02, n = 90, w = 350;
    const pts = [];
    for (let i = 0; i < n; i++) {
      const v = 0.5 + amp * Math.tanh(2.4 * Math.sin(i / n * 2 * Math.PI * 2.2)) + 0.015 * Math.sin(i * 1.7);
      pts.push(`${(i / (n - 1) * w).toFixed(1)},${(height - 4 - v * (height - 8)).toFixed(1)}`);
    }
    const last = pts.at(-1).split(",");
    // Le tracé s'estompe vers la gauche : le passé compte moins que l'instant
    return `<svg width="100%" height="${height}" viewBox="0 0 ${w} ${height}" preserveAspectRatio="none">
      <defs><linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="${c.primary}" stop-opacity="0"/><stop offset=".5" stop-color="${c.primary}" stop-opacity=".7"/><stop offset="1" stop-color="${c.primary}"/></linearGradient></defs>
      <polyline points="${pts.join(" ")}" fill="none" stroke="url(#fade)" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${c.primary}"/></svg>`;
  }

  function status(text, color, right = "T+ 4:32") {
    return `<div class="top"><div class="row" style="gap:7px">${led(color)}${label(text, color)}</div>
      <span style="font-size:13px;font-weight:600;letter-spacing:1px;color:${c.dim}">${right}</span></div>`;
  }

  function placement() {
    return `<div style="font-size:12px;color:${c.dim};max-width:300px;line-height:1.45;text-align:center">${ex[2]}</div>`;
  }

  function signalStrip(kind) {
    const color = { ok: c.ok, weak: c.primary, none: c.dim }[kind];
    return `<div style="width:100%"><div class="row" style="gap:6px;margin-bottom:4px">${led(color)}${label("Mouvement · " + ex[3])}</div>${trace(kind)}</div>`;
  }

  function ready() {
    const side = 330, page = side * 0.5, index = s.exercise ?? 0, drag = s.drag || 0;
    const mine = s.mine || [0, 1, 2, 3, 4], at = mine.indexOf(index);
    const items = mine.map(e => EXERCISES[e]).map(([ic, name], i) => {
      const x = (i - at) * page + drag, opacity = Math.max(0, 1 - Math.abs(x) / page);
      if (!opacity) return "";
      return `<div class="center" style="position:absolute;inset:0;gap:${side * 0.04}px;transform:translate(${x}px, ${-side * 0.03}px);opacity:${opacity}">
        ${icon(ic, c.primary, side * 0.24)}
        <span style="font-size:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase">${name}</span></div>`;
    }).join("");
    const dots = mine.map((_, i) => `<span style="width:5px;height:5px;border-radius:50%;background:${i === at ? c.primary : hexA(c.dim, .45)}"></span>`).join("");
    const inner = side * 0.76, disc = side * 0.58;
    return `<div class="top">${iconBtn("chart")}${iconBtn("gear")}</div>
      <div class="hero">
        ${ring({ lit: 60, colors: "pale", sweep: 17, content: `
          <div style="position:relative;width:${side}px;height:${side}px">
            <div style="position:absolute;left:${(side - disc) / 2}px;top:${(side - disc) / 2}px;width:${disc}px;height:${disc}px;border-radius:50%;
                 background:radial-gradient(circle, ${hexA(c.primary, .10)} 0%, ${hexA(c.primary, .03)} 70%);border:1px solid ${hexA(c.primary, .28)}"></div>
            <div style="position:absolute;left:${(side - inner) / 2}px;top:${(side - inner) / 2}px;width:${inner}px;height:${inner}px;border-radius:50%;overflow:hidden">${items}</div>
            <div class="row" style="position:absolute;left:0;right:0;top:${side / 2 + side * 0.19 - 2.5}px;justify-content:center;gap:6px">${dots}</div>
          </div>` })}
        <div style="font-size:12px;color:${c.dim};max-width:300px;line-height:1.45;text-align:center">${EXERCISES[index][2]}</div>
        <div class="row" style="gap:10px;height:40px;opacity:${[6, 7, 8].includes(index) ? 1 : 0}">

  // Jauge d'endurance : arc de 270° ouvert en bas, 5 zones de 9 graduations (barème) ou arc continu
  function gauge({ size = 150, score, fill, level }) {
    const cx = size / 2, outer = size / 2 - 4, per = 9, zones = 5, zoned = !!level;
    const count = zoned ? per * zones : per * zones + zones - 1, slots = per * zones + zones - 1;
    const lit = Math.round(fill * count);
    let ticks = "";
    for (let i = 0; i < count; i++) {
      const slot = zoned ? i + Math.floor(i / per) : i;
      const a = (135 + 270 * slot / (slots - 1)) * Math.PI / 180;
      const major = zoned ? i % per === Math.floor(per / 2) : i % 5 === 0, inner = outer * (major ? 0.86 : 0.92);
      const color = i < lit ? mixColor(c.secondary, c.primary, i / (count - 1)) : c.line;
      ticks += `<line x1="${cx + Math.cos(a) * inner}" y1="${cx + Math.sin(a) * inner}" x2="${cx + Math.cos(a) * outer}" y2="${cx + Math.sin(a) * outer}" stroke="${color}" stroke-width="${major ? 3.4 : 2.4}" stroke-linecap="round"/>`;
    }
    const m = Math.min(lit, count - 1), ms = zoned ? m + Math.floor(m / per) : m, ma = (135 + 270 * ms / (slots - 1)) * Math.PI / 180;
    ticks += `<circle cx="${cx + Math.cos(ma) * (outer + 1)}" cy="${cx + Math.sin(ma) * (outer + 1)}" r="4.5" fill="${c.text}"/>`;
    return `<div style="position:relative;width:${size}px;height:${size}px;flex:none">
      <svg width="${size}" height="${size}" style="position:absolute;inset:0;${glow ? `filter:drop-shadow(0 0 ${8 * Math.min(glow, 1)}px ${hexA(c.primary, .35)})` : ""}">${ticks}</svg>
      <div class="center" style="position:absolute;inset:0;gap:2px">
        <div style="font-size:${size * 0.27}px;font-weight:700;line-height:1;background:linear-gradient(90deg,${c.secondary},${c.primary});-webkit-background-clip:text;color:transparent">${score}</div>
        ${level ? `<div style="font-size:${size * 0.075}px;font-weight:700;letter-spacing:1px;color:${c.primary};text-transform:uppercase">${level}</div>` : ""}
      </div></div>`;
  }

  // Illustrations de placement : la même silhouette que les pictogrammes, l'iPhone en couleur
  function phoneMark(x, y, w, h, color) {
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(w, h) * 0.3}" fill="${color}" stroke="none" style="filter:drop-shadow(0 0 1.2px ${color})"/>`;

  function scene(name, size) {
    const fg = c.text, accent = c.ok;
    const svg = (vb, body, w = size) => `<svg width="${w}" viewBox="${vb}" fill="${fg}" stroke="${fg}" style="--gear:${hexA(fg, .4)};display:block;overflow:visible">${body}</svg>`;
    const note = (x, y, text, anchor = "middle") => `<text x="${x}" y="${y}" font-size="1.25" fill="${accent}" stroke="none" text-anchor="${anchor}" font-family="Inter" font-weight="700">${text}</text>`;
    if (name === "pushup") {
      // De profil, en planche : l'iPhone à plat sous le visage, entre les mains
      return svg("-1 4 22 16", P.Pompes.replace('opacity=".55"', `opacity=".35"`)
        + `<path d="M4.3 13.4 V17.4" stroke="${accent}" stroke-width=".25" stroke-dasharray=".5 .45" fill="none"/>`
        + phoneMark(3.1, 17.75, 2.7, 0.5, accent) + note(-0.5, 7.4, "SOUS TON VISAGE", "start"));
    }
    if (name === "camera") {
      // De profil, debout ; l'iPhone debout sur une chaise, deux grands pas devant
      const stool = `<path d="M30 12.2 H36 M30.8 12.2 V18.3 M35.2 12.2 V18.3" stroke-width=".9" stroke-linecap="round" fill="none" opacity=".4"/>`;
      const arrow = `<path d="M13.5 19.6 H28.5 M27.4 18.9 L28.5 19.6 L27.4 20.3 M14.6 18.9 L13.5 19.6 L14.6 20.3" stroke="${accent}" stroke-width=".3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
      return svg("0 1.5 38 20.5", P.Biceps.replace("M1.5 18.3 H18.5", "M1.5 18.3 H37") + stool + phoneMark(32.4, 9.3, 1.3, 2.8, accent)
        + arrow + note(21, 21.6, "2 GRANDS PAS") + note(37.6, 7.8, "À HAUTEUR DE TAILLE", "end"));

  // Silhouette de face (squelette), mains basses avec haltères, une flexion en cours
  function frontFigure() {
    const y = 6.2, sL = [8.1, y], sR = [11.9, y], neck = [10, y], hip = [10, y + 5];
    const eL = [7.5, y + 2.8], eR = [12.5, y + 2.8], hL = [7.6, y + 5.4], hR = [13.6, y + 1.2];
    return line([hL, eL, sL, sR, eR, hR]) + line([neck, hip]) + head([10, y - 2.2])
      + line([[8.9, 18.2], [9.3, hip[1] + 3.6], hip, [10.7, hip[1] + 3.6], [11.1, 18.2]])
      + `<rect x="${hL[0] - 0.6}" y="${hL[1] - 0.2}" width="1.2" height="1.5" rx=".3" stroke="none"/><rect x="${hR[0] - 0.6}" y="${hR[1] - 0.9}" width="1.2" height="1.5" rx=".3" stroke="none"/>`;
  }

  function chevronRight(color = c.dim, size = 11) { return icon("right", color, size); }
  function header(title, back) { return back
    ? `<div class="top">${iconBtn("back", c.text)}<span style="font-size:13px;font-weight:700;letter-spacing:2px">${title}</span><span style="width:40px"></span></div>`
    : `<div class="top"><span style="font-size:16px;font-weight:700;letter-spacing:3px">${title}</span>${iconBtn("xmark", c.text)}</div>`; }
  function sparkline(pts, w, h, color = c.primary) {
    const lo = Math.min(...pts), hi = Math.max(...pts), k = v => (h - (v - lo) / Math.max(hi - lo, .5) * h).toFixed(1);
    return `<svg width="100%" height="${h + 8}" viewBox="-4 -4 ${w + 8} ${h + 8}" preserveAspectRatio="none" style="display:block">
      <polyline points="${pts.map((v, i) => `${(i / (pts.length - 1) * w).toFixed(1)},${k(v)}`).join(" ")}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
  }
  function tile(title, body) { return `<div style="flex:1;min-height:136px;padding:14px;border:1px solid ${c.line};border-radius:${r}px;background:${c.panel};display:flex;flex-direction:column;gap:6px">
      <div class="row" style="justify-content:space-between">${label(title)}${chevronRight()}</div>${body}</div>`; }

  // Score d'endurance : jauge, évolution, courbe (détail)
  function endurancePanel() {
    const pts = [31, 32, 32, 34, 35, 35, 36, 37, 37, 38, 39], w = 150, h = 40, lo = 30, hi = 40;
    const line = pts.map((v, i) => `${(i / 10 * w).toFixed(1)},${(h - (v - lo) / (hi - lo) * h).toFixed(1)}`).join(" ");
    return panel("Score d'endurance", `<span style="width:22px;height:22px;border-radius:50%;border:1.5px solid ${c.dim};color:${c.dim};font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif">i</span>`,
      `<div class="row" style="gap:16px;align-items:center">
        ${gauge({ score: 39, fill: 0.52, level: "Bon" })}
        <div style="display:flex;flex-direction:column;gap:8px">
          <div><div style="font-size:20px;font-weight:700;color:${c.ok}">▲ +8 %</div><div style="font-size:11px;color:${c.dim}">en 4 semaines</div></div>
          <svg width="${w}" height="${h + 6}" viewBox="0 -3 ${w} ${h + 6}"><polyline points="${line}" fill="none" stroke="${c.primary}" stroke-width="2" stroke-linejoin="round"/>
            <circle cx="${w}" cy="${h - (39 - lo) / (hi - lo) * h}" r="4" fill="${c.primary}"/></svg></div></div>
        <div style="font-size:11px;color:${c.dim};line-height:1.4">Meilleure série : 22 pompes · niveau bon pour un homme de 30-39 ans (barème SCPE).</div>`);
  }

  // Forme : dernière séance, zone, courbe sur la bande normale (détail)
  function formPanel() {
    const pts = [99, 101, 97, 103, 100, 98, 104, 101, 96, 100, 99, 102], w = 310, h = 70, lo = 85, hi = 115;
    const y = v => (4 + (h - 8) * (1 - (v - lo) / (hi - lo))).toFixed(1);
    const x = i => (i / (pts.length - 1) * w).toFixed(1);
    const chart = `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <rect x="0" y="${y(104)}" width="${w}" height="${y(96) - y(104)}" fill="${hexA(c.primary, .08)}"/>
        <line x1="0" x2="${w}" y1="${y(100)}" y2="${y(100)}" stroke="${hexA(c.dim, .6)}" stroke-dasharray="3 3"/>
        <polyline points="${pts.map((v, i) => `${x(i)},${y(v)}`).join(" ")}" fill="none" stroke="${hexA(c.primary, .7)}" stroke-width="1.5"/>
        ${pts.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="${i === pts.length - 1 ? 4.5 : 2.5}" fill="${v < 96 ? c.warn : v > 104 ? c.ok : c.primary}"/>`).join("")}</svg>`;
    return panel("Forme", "", `<div class="row" style="gap:12px;align-items:baseline"><span style="font-size:40px;font-weight:700;color:${c.primary}">102 %</span>
        <span style="font-size:13px;font-weight:700;color:${c.primary}">FORME NORMALE</span><span style="flex:1"></span><span style="font-size:11px;color:${c.dim}">lundi</span></div>
      ${chart}<div class="row" style="justify-content:space-between;font-size:11px;color:${c.dim}"><span>12 dernières séances</span><span>bande : ta variation normale</span></div>
      <div style="font-size:11px;color:${c.dim};line-height:1.4">Vitesse de tes répétitions et maintien de cette vitesse au fil des séries, comparés à tes séances habituelles.</div>`);
  }

  // Volume sur 12 semaines (détail de l'activité)
  function volumePanel() {
    const weeks = [60, 0, 85, 110, 95, 120, 140, 0, 130, 165, 150, 172];
    const best = Math.max(...weeks), avg = weeks.reduce((a, b) => a + b) / weeks.length;
    const vbars = weeks.map((v, i) => {
      const last = i === weeks.length - 1;
      return `<div class="center" style="flex:1;gap:5px;justify-content:flex-end;height:100%">
        ${last ? `<span style="font-size:10px;font-weight:700">${v}</span>` : ""}
        <div style="width:100%;max-width:18px;height:${Math.max(2, Math.round(v / best * 78))}px;border-radius:2px 2px 1px 1px;
          background:${last ? `linear-gradient(180deg,${c.primary},${c.secondary})` : hexA(c.primary, v ? .35 : .15)}"></div>
        <span style="font-size:9px;color:${c.dim}">${i % 3 === 2 ? ["S35", "S38", "S41", "S44"][(i - 2) / 3] : "&nbsp;"}</span></div>`;
    }).join("");
    return panel("Volume · 12 semaines", label("reps / semaine"), `<div style="position:relative;height:112px"><div class="row" style="height:100%;gap:6px;align-items:flex-end">${vbars}</div>
        <div style="position:absolute;left:0;right:0;bottom:${20 + avg / best * 78}px;border-top:1px dashed ${hexA(c.dim, .6)}"></div>
        <span style="position:absolute;left:0;bottom:${23 + avg / best * 78}px;font-size:9px;color:${c.dim};background:${c.panel};padding-right:4px">moy. ${Math.round(avg)}</span></div>`);
  }

  // Activité : la semaine (cadran + chiffres clés) et la régularité sur 16 semaines
  function activityPanel(early) {
    const week = `<div class="row" style="gap:18px">
        ${ring({ lit: early ? 20 : 60, size: 128, content: `<div style="font-size:36px;font-weight:700;line-height:1">${early ? 34 : 172}</div><div style="margin-top:4px">${label("reps")}</div>` })}
        <div style="display:flex;flex-direction:column;gap:10px;flex:1">
          ${label("Cette semaine", c.text)}
          ${early ? `<span style="font-size:14px;font-weight:700;color:${c.ok}">Bonne reprise</span>`
                  : `<div><span style="font-size:20px;font-weight:700;color:${c.ok}">▲ +15 %</span><div style="font-size:11px;color:${c.dim}">vs semaine dernière (150)</div></div>`}
          ${[["Séances", early ? "2" : "3"], ["Temps", early ? "9 min" : "38 min"], ["Régularité", early ? "1 sem." : "6 sem. de suite"]].map(([k, v]) =>
            `<div class="row" style="justify-content:space-between">${label(k)}<span style="font-size:14px;font-weight:700">${v}</span></div>`).join("")}
        </div></div>`;
    let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const days = ["L", "M", "M", "J", "V", "S", "D"];
    let grid = "";
    for (let d = 0; d < 7; d++) {
      grid += `<span style="font-size:9px;color:${c.dim};width:10px">${days[d]}</span>`;
      for (let wk = 0; wk < 16; wk++) {
        const future = wk === 15 && d > 1;
        let v = future ? -1 : (rnd() < 0.42 ? Math.ceil(rnd() * 3) : 0);
        if (early && v >= 0) v = (wk === 15 && d === 1) || (wk === 14 && d === 4) ? 2 : 0;
        const bg = v < 0 ? "transparent" : v === 0 ? hexA(c.line, .9) : hexA(c.primary, [0, .35, .65, 1][v]);
        grid += `<span style="width:14px;height:14px;border-radius:3px;background:${bg}"></span>`;
      }
    }
    const calendar = `<div style="display:grid;grid-template-columns:12px repeat(16, 14px);gap:4px;justify-content:space-between">${grid}</div>
      <div class="row" style="justify-content:space-between;font-size:11px;color:${c.dim}"><span>${early ? 2 : 41} jours actifs en 16 sem.</span>
        <span class="row" style="gap:3px">moins ${[0, .35, .65, 1].map(a => `<span style="width:9px;height:9px;border-radius:2px;background:${a ? hexA(c.primary, a) : c.line}"></span>`).join("")} plus</span></div>`;
    return panel("Activité", chevronRight(), `${week}<div style="height:1px;background:${c.line}"></div>${calendar}`);
  }

  function history() {
    if (s.sub === "endurance") return `${header("SCORE D'ENDURANCE", true)}<div style="display:flex;flex-direction:column;gap:14px;margin-top:10px">${endurancePanel()}</div>`;
    if (s.sub === "form") return `${header("FORME", true)}<div style="display:flex;flex-direction:column;gap:14px;margin-top:10px">${formPanel()}</div>`;
    if (s.sub === "activity") return `${header("ACTIVITÉ", true)}<div style="display:flex;flex-direction:column;gap:14px;margin-top:10px">${volumePanel()}</div>`;
    const early = s.sub === "early";
    // Conseil (seulement s'il y a lieu)
    const advice = early ? "" : `<div style="padding:14px;border:1px solid ${c.line};border-radius:${r}px;background:${c.panel};display:flex;flex-direction:column;gap:12px">${label("Conseil")}
        <div class="row" style="gap:12px;align-items:flex-start"><span style="width:8px;height:8px;border-radius:50%;background:${c.ok};margin-top:6px;flex:none"></span>
        <div><div style="font-size:14px;font-weight:700">Record à portée</div><div style="font-size:12px;color:${c.dim};line-height:1.5;margin-top:3px">Ton record de série est 24. Tu en as fait 22 récemment : il t'en manque 2.</div></div></div></div>`;
    // Score d'endurance et Forme, côte à côte
    const big = (text, color) => `<span style="font-size:32px;font-weight:700;line-height:1.1;color:${color}">${text}</span>`;
    const small = (text, color = c.dim, bold = false) => `<span style="font-size:11px;font-weight:${bold ? 700 : 400};color:${color};line-height:1.35">${text}</span>`;
    const gradientText = text => `<span style="font-size:32px;font-weight:700;line-height:1.1;background:linear-gradient(90deg,${c.secondary},${c.primary});-webkit-background-clip:text;color:transparent;align-self:flex-start">${text}</span>`;
    const tiles = early
      ? tile("Score d'endurance", big("2 / 3", c.dim) + small("séries dans une séance")) + tile("Forme", big("2 / 3", c.dim) + small("séances de référence"))
      : tile("Score d'endurance", gradientText("39") + small("Bon", c.primary, true) + `<span style="flex:1"></span>` + sparkline([31, 32, 32, 34, 35, 35, 36, 37, 37, 38, 39], 140, 22))
        + tile("Forme", `<span style="font-size:32px;font-weight:700;line-height:1.1;color:${c.primary}">102<span style="font-size:14px"> %</span></span>` + small("Forme normale", c.primary, true) + `<span style="flex:1"></span>` + sparkline([99, 101, 97, 103, 100, 98, 104, 101, 96, 100, 99, 102], 140, 22, hexA(c.primary, .7)));
    // Records
    const record = (name, value, date, fresh) => `<div style="flex:1;padding:10px;border:1px solid ${fresh ? hexA(c.warn, .6) : c.line};border-radius:${r}px;background:${fresh ? hexA(c.warn, .06) : "transparent"}">
        ${label(name)}<div class="row" style="gap:4px;margin-top:6px"><span style="font-size:24px;font-weight:700;color:${fresh ? c.warn : c.text}">${value}</span>${fresh ? icon("star", c.warn, 12) : ""}</div>
        <div style="font-size:10px;color:${c.dim};margin-top:2px">${date}</div></div>`;
    const records = early
      ? `<div class="row" style="gap:8px;align-items:stretch">${record("Série", "12", "aujourd'hui", true)}${record("Séance", "22", "aujourd'hui", true)}${record("Semaine", "34", "cette semaine", true)}</div>`
      : `<div class="row" style="gap:8px;align-items:stretch">${record("Série", "24", "aujourd'hui", true)}${record("Séance", "72", "12 oct.")}${record("Semaine", "172", "cette semaine", true)}</div>`;
    // Séances
    // Séances par jour : la date une fois, les séances à leurs heures ; aujourd'hui mis en avant
    const days = early
      ? [["Aujourd'hui", [["07:40", 22, 2, "+10", true]]], ["Ven 23 oct", [["18:20", 12, 1, ""]]]]
      : [["Aujourd'hui", [["18:30", 62, 5, "+2", true], ["07:15", 60, 5, "+6"]]],
         ["Hier", [["19:40", 54, 5, "−4"]]],
         ["Jeu 22 oct", [["12:10", 58, 5, "+2"], ["07:30", 56, 4, "−16"]]],
         ["Lun 12 oct", [["19:02", 72, 6, "+14", true]]]];
    const sessions = days.flatMap(d => d[1]);
    const list = `<div style="display:flex;flex-direction:column;gap:14px">${days.map(([day, rows], g) => {
      const today = day === "Aujourd'hui", total = rows.reduce((a, x) => a + x[1], 0);
      const body = rows.map(([hour, tot, n, delta, rec], i) => `<div class="row" style="gap:12px;padding:10px 0;${i ? `border-top:1px solid ${c.line}` : ""}">
        <span style="display:flex">${icon("pushup", c.primary, 22)}</span>
        <div style="flex:1"><div style="font-size:15px;font-weight:700">${hour}</div><div style="font-size:11px;color:${c.dim}">${n} série${n > 1 ? "s" : ""}</div></div>
        ${rec ? icon("star", c.warn, 13) : ""}
        <span style="font-size:11px;font-weight:700;color:${delta.startsWith("+") ? c.ok : c.dim}">${delta}</span>
        <span style="font-size:22px;font-weight:700;min-width:36px;text-align:right">${tot}</span>
        ${chevronRight(c.dim, 12)}</div>`).join("");
      return `<div style="${today ? `margin:0 -10px;padding:10px 10px 0;border-radius:${r}px;background:${hexA(c.primary, .07)};border:1px solid ${hexA(c.primary, .35)}` : ""}">
        <div class="row" style="justify-content:space-between;padding-bottom:2px"><span style="font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:${today ? c.primary : c.text}">${day}</span>
        ${label(`${total} reps${rows.length > 1 ? ` · ${rows.length} séances` : ""}`)}</div>${body}</div>`;
    }).join("")}</div>`;
    return `${header("HISTORIQUE")}
      <div style="display:flex;flex-direction:column;gap:14px;margin-top:10px">
        ${exerciseBar(1)}
        ${advice}
        <div class="row" style="gap:10px;align-items:stretch">${tiles}</div>
        ${activityPanel(early)}
        ${panel("Records", "", records)}
        ${panel("Séances", label(`${early ? 2 : 42} au total`), list)}
      </div>`;
  }

  // (i) : explication du score d'endurance
  function enduranceInfo() {
    const section = (title, text) => `<div style="display:flex;flex-direction:column;gap:8px">${label(title)}<div style="font-size:13px;line-height:1.55">${text}</div></div>`;
    const weights = [["15 s", 1.3, c.ok], ["30 s", 1.1, c.ok], ["1 min", 1.0, c.text], ["2 min", 0.9, c.dim], ["3 min", 0.8, c.dim]].map(([k, v, col]) =>
      `<div class="center" style="flex:1;gap:4px"><span style="font-size:10px;color:${c.dim}">${k}</span><span style="font-size:14px;font-weight:700;color:${col}">×${v.toFixed(1).replace(".", ",")}</span></div>`).join("");
    return `<div class="top"><span style="font-size:16px;font-weight:700;letter-spacing:3px">SCORE D'ENDURANCE</span>${iconBtn("xmark", c.text)}</div>
      <div style="display:flex;flex-direction:column;gap:20px;margin-top:12px">
        ${section("Ce qu'il mesure", "L'endurance musculaire locale : la capacité d'un groupe de muscles à répéter un mouvement série après série, avec peu de repos. Elle combine trois qualités : le nombre de répétitions d'affilée, le maintien de ce nombre d'une série à l'autre, et la vitesse de récupération entre les séries.")}
        <div style="display:flex;flex-direction:column;gap:10px">${label("Le calcul")}
          <div class="center" style="gap:8px;padding:14px 0;border:1px solid ${c.line};border-radius:${r}px;background:${c.panel};font-size:16px;font-weight:700">
            <span>r₁ + r₂·k(R₂) + r₃·k(R₃)</span><span style="color:${c.dim}">k(R) = (60 s ÷ R)^0,2</span></div>
          <div style="font-size:13px;line-height:1.55">r₁, r₂, r₃ : les répétitions des trois premières séries. R : le repos qui précède la série (borné entre 15 s et 5 min). Un format commun de trois séries rend les séances — et les personnes — comparables.</div>
          <div class="row" style="gap:0">${weights}</div></div>
        ${section("Pourquoi le repos compte", "Pendant un effort bref et intense, le muscle puise dans ses réserves de phosphocréatine. Entre deux séries, elles se reconstituent vite au début puis de plus en plus lentement : une bonne moitié en quelques dizaines de secondes, presque tout en 3 à 5 minutes…")}
      </div>`;
  }

  // Détail d'une séance : séries, récupérations, rythme rep par rep
  function sessionDetail() {
    const sets = [[14, "0:22", "1.5", null], [13, "0:21", "1.6", "1:12"], [12, "0:20", "1.6", "1:30"], [11, "0:19", "1.7", "1:41"], [10, "0:18", "1.8", "1:55"]];
    const rows = sets.map(([n, d, cad, rest], i) => `<div class="row" style="padding:8px 0;${i ? `border-top:1px solid ${c.line}` : ""};font-size:14px;font-weight:600">
        <span style="flex:1;color:${c.dim}">S${String(i + 1).padStart(2, "0")}</span>
        <span style="flex:1;text-align:right;color:${i === 0 ? c.warn : c.text}">${i === 0 ? "★ " : ""}${n}</span>
        <span style="flex:1;text-align:right">${d}</span><span style="flex:1;text-align:right">${cad} s</span>
        <span style="flex:1;text-align:right;color:${c.dim}">${rest || "—"}</span></div>`).join("");
    const head = `<div class="row">${["Série", "Reps", "Durée", "Cadence", "Récup."].map((h, i) => `<span style="flex:1;text-align:${i ? "right" : "left"}">${label(h)}</span>`).join("")}</div>`;
    // Rythme : durée de chaque rep, série par série (fatigue visible)
    const w = 310, h = 90, lo = 1.2, hi = 2.3;
    const series = sets.map(([n], k) => Array.from({ length: n }, (_, i) => 1.35 + k * 0.07 + 0.5 * Math.pow(i / (n - 1), 2.2) + 0.03 * Math.sin(i * 2.1 + k)));
    let x = 0; const step = w / (sets.reduce((a, [n]) => a + n, 0) + 4);
    const lines = series.map((reps, k) => {
      const pts = reps.map((v, i) => `${(x + i * step).toFixed(1)},${(h - (v - lo) / (hi - lo) * h).toFixed(1)}`);
      const start = x; x += reps.length * step + step;
      return `<polyline points="${pts.join(" ")}" fill="none" stroke="${mixColor(c.secondary, c.primary, k / 4)}" stroke-width="2" stroke-linejoin="round"/>
        <text x="${start}" y="${h + 12}" font-size="9" fill="${c.dim}">S${String(k + 1).padStart(2, "0")}</text>`;
    }).join("");
    const rhythm = `<svg width="100%" height="${h + 16}" viewBox="0 0 ${w} ${h + 16}">${lines}</svg>
      <div style="font-size:11px;color:${c.dim};line-height:1.4">Durée de chaque répétition : elle s'allonge en fin de série quand la fatigue arrive.</div>`;
    return `<div class="top">${iconBtn("back", c.text)}<span style="font-size:13px;font-weight:700;letter-spacing:2px">LUN 26 OCT · 19:40</span><span style="width:40px"></span></div>
      <div style="display:flex;flex-direction:column;gap:14px;margin-top:10px">
        <div class="row" style="gap:18px">
          ${ring({ lit: 60, size: 130, content: `<div style="font-size:40px;font-weight:700;line-height:1">60</div><div style="margin-top:3px">${label("reps")}</div>` })}
          <div style="display:flex;flex-direction:column;gap:8px;flex:1">
            <div class="row" style="gap:6px">${icon("pushup", c.primary, 20)}<span style="font-size:14px;font-weight:700;letter-spacing:1.5px">POMPES</span></div>
            <span style="font-size:13px;font-weight:700;color:${c.ok}">▲ +6 vs jeudi 22</span>
            <span class="row" style="gap:4px;font-size:12px;font-weight:700;color:${c.warn}">${icon("star", c.warn, 11)} Record de série (14)</span>
            <span style="font-size:12px;color:${c.dim}">12:08 · 5 séries</span>
          </div></div>
        ${panel("Séries", "", head + `<div>${rows}</div>`)}
        ${panel("Rythme", label("s / rep"), rhythm)}
      </div>`;
  }

  // Mes exercices : ceux du cadran (− pour retirer, ≡ pour l'ordre), puis les autres (+ pour ajouter)
  function myExercises() {

    return `<div class="top"><span style="font-size:16px;font-weight:700;letter-spacing:3px">MES EXERCICES</span>${iconBtn("xmark", c.text)}</div>
      <div style="display:flex;flex-direction:column;gap:22px;margin-top:12px">

      return `<div class="row" style="gap:12px;padding:4px 0">
        <span style="display:flex;width:70px;height:26px;border-radius:3px;overflow:hidden;border:1px solid ${c.line}">${swatches}</span>
        <span style="flex:1;font-family:${o.font === "monospaced" ? "'JetBrains Mono', monospace" : "Inter, sans-serif"};font-size:14px;font-weight:700;text-transform:uppercase">${o.name}</span>
        <span style="width:20px;height:20px;border-radius:50%;border:2px solid ${on ? c.primary : c.dim};display:flex;align-items:center;justify-content:center">
          ${on ? `<span style="width:10px;height:10px;border-radius:50%;background:${c.primary}"></span>` : ""}</span></div>`;
    }).join("");
    const toggle = `<div class="row" style="justify-content:space-between"><span style="font-size:14px;font-weight:700">MODE ANALYSE</span>
        <span style="width:51px;height:31px;border-radius:16px;background:${c.line};position:relative"><span style="position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff"></span></span></div>
      ${note("Affiche pendant la séance l'enregistrement des mesures (●) et le diagnostic des capteurs, pour analyser une séance qui compte mal.")}`;
    return `<div class="top"><span style="font-size:16px;font-weight:700;letter-spacing:3px">RÉGLAGES</span>${iconBtn("xmark", c.text)}</div>
      <div style="display:flex;flex-direction:column;gap:14px;margin-top:12px">
      ${panel("Mes exercices", `<div class="row" style="gap:8px;height:36px">${[0, 1, 2, 3, 4].map(e => icon(EXERCISES[e][0], c.primary, 22)).join("")}<span style="flex:1"></span>${icon("right", c.dim, 11)}</div>
        ${note("Les exercices du cadran, dans l'ordre où ils défilent.")}
        <div style="height:1px;background:${c.line};margin:4px 0"></div>
        <div class="row" style="justify-content:space-between"><span style="font-size:14px;font-weight:700">J'AI UN BRASSARD</span>
          <span style="width:51px;height:31px;border-radius:16px;background:${c.line};position:relative"><span style="position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff"></span></span></div>
        ${note("Biceps, développé, rowing : iPhone posé à 2 m, la caméra compte ; rien n'est enregistré. Avec un brassard, le compte est encore plus précis.")}`)}
      ${panel("Profil", `<div class="row">${choice("Femme", false)}${choice("Homme", true)}</div>
        <div class="row" style="justify-content:space-between"><span style="font-size:11px;font-weight:600;letter-spacing:1px">ANNÉE DE NAISSANCE</span><span style="font-size:14px;color:${c.primary}">1988 ⌄</span></div>
        ${note("Facultatif, reste sur ton iPhone. Sert à situer ton niveau en pompes sur le barème de référence (score d'endurance).")}`)}
      ${panel("Retour sonore", `<div class="row">${choice("Sons", s.audio === "sons")}${choice("Sons + voix", s.audio === "voix")}${choice("Silence", s.audio === "silence")}</div>
        ${note({ sons: "Une note par répétition, deux notes tous les 5, trois tous les 10. Notes de départ, fin de série, fin de séance.",
                 voix: "Les sons, plus la voix aux paliers (5, 10, 15…) et en fin de série. Voix : Audrey.",
                 silence: "Aucun son. Les vibrations restent." }[s.audio])}`)}
      ${panel("Thème", `<div style="display:flex;flex-direction:column;gap:8px">${themes}</div>`)}
      ${panel("Analyse", toggle)}
      <div style="font-size:10px;color:${c.dim};text-align:center">Comptage par caméra 3D et capteurs de mouvement · aucune image enregistrée</div></div>`;
  }
}

window.renderScreen = (theme, screen) => render(theme, screen);
</script>
</body>
</html>
